# Lovec — конфіг пошуків.
# Кожен пошук = одна сторінка-список на сайті. Скрейпер бере з неї посилання
# на оголошення, відкриває нові і вирішує: приватна особа чи ріелтор.

interval_minutes: 5          # як часто перевіряти (не ставити менше 3 — забанять)
request_delay_seconds: [2, 5] # випадкова пауза між запитами
max_new_per_run: 40          # скільки нових детальних сторінок відкривати за один прохід
first_run_silent: true       # перший прохід лише наповнює БД, без пушів (інакше прилетить 500 штук)

# Фільтр (див. lovec/classify.py). Ховаються ЛИШЕ 100% ріелтори (ім'я з real/s.r.o./maklér,
# профіль агентства, «RK ponúka», чорний список). Решта приходить як 🟢 або 🟡.
score:
  private_max: 1        # м'який score <= 1 -> 🟢, вище -> 🟡
  phone_reuse_limit: 3  # той самий продавець у >=3 оголошеннях -> 🟡

notify:
  private: true
  suspicious: true

