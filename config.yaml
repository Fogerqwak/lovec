    url: "https://www.nehnutelnosti.sk/vysledky/byty/bratislava/prenajom?order=NEWEST"
    deal: prenajom
  - name: "Nehnuteľnosti · domy prenájom BA"
    source: nehnutelnosti
    url: "https://www.nehnutelnosti.sk/vysledky/domy/bratislava/prenajom?order=NEWEST"
