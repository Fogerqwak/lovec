<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lovec · ліди</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --ink: #18181b; --muted: #71717a; --line: #e7e5e0;
    --accent: #1f6f50; --green: #1f8f5f; --yellow: #c48a0a; --red: #c2413a; --chip: #efede7;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111113; --card: #1a1a1d; --ink: #f1f1f2; --muted: #9a9aa2; --line: #2a2a2f;
            --accent: #4fc496; --chip: #242428; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
           padding: 14px 16px 10px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .stats { color: var(--muted); font-size: 13px; margin-left: auto; }
  .tabs { margin-top: 10px; overflow-x: auto; flex-wrap: nowrap; }
  .tab { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px;
         padding: 6px 12px; font: inherit; font-size: 14px; white-space: nowrap; cursor: pointer; }
  .tab.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  input[type=search], select, textarea { font: inherit; color: var(--ink); background: var(--card);
         border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  input[type=search] { flex: 1; min-width: 140px; }
  button.run { border: 0; background: var(--accent); color: #fff; border-radius: 10px; padding: 8px 12px;
               font: inherit; font-size: 14px; cursor: pointer; }
  main { max-width: 820px; margin: 0 auto; padding: 12px 16px 60px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px;
          margin-bottom: 10px; }
  .card.done { opacity: .62; }
  .top { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .private .dot { background: var(--green); } .suspicious .dot { background: var(--yellow); }
  .agency .dot { background: var(--red); }
  .title { display: block; margin: 6px 0 4px; font-weight: 600; font-size: 16px; color: var(--ink);
           text-decoration: none; }
  .title:hover { text-decoration: underline; }
  .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .chip { background: var(--chip); border-radius: 6px; padding: 2px 8px; font-size: 13px; }
  .chip.price { font-weight: 600; }
  .chip.warn { background: color-mix(in srgb, var(--yellow) 18%, transparent); }
  a.tel { color: var(--accent); font-weight: 600; text-decoration: none; }
  .desc { color: var(--muted); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 3;
          -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  .desc.open { -webkit-line-clamp: unset; }
  details { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .actions { display: flex; gap: 8px; margin-top: 10px; align-items: flex-start; }
  .actions select { flex: none; }
  .actions textarea { flex: 1; min-height: 38px; resize: vertical; font-size: 14px; }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; }
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>Lov<span>ec</span></h1>
    <div class="stats" id="stats">…</div>
  </div>
  <div class="row tabs" id="tabs"></div>
  <div class="row" style="margin-top:8px">
    <input type="search" id="q" placeholder="Пошук: вулиця, телефон, нотатка…">
    <select id="deal"><option value="">Все</option><option value="predaj">Продаж</option><option value="prenajom">Оренда</option></select>
    <button class="run" id="run">Перевірити зараз</button>
  </div>
</header>
<main id="list"></main>

<script>
const STATUSES = __STATUSES__;
const SRC = { bazos: "Bazoš", nehnutelnosti: "Nehnuteľnosti", reality_sk: "Reality.sk", topreality: "TopReality" };
const CAT = { private: "приватна", suspicious: "можливо приватна", agency: "RK" };
const TABS = [
  { id: "new", label: "🆕 Нові", cat: "private,suspicious", status: "new" },
  { id: "work", label: "📞 В роботі", cat: "private,suspicious", statuses: ["called", "no_answer", "meeting", "contract"] },
  { id: "all", label: "Всі ліди", cat: "private,suspicious" },
  { id: "agency", label: "🔴 Відсіяні RK", cat: "agency" },
];
let tab = TABS[0], rows = [];

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const phone = p => p.length === 12 ? `+${p.slice(0,3)} ${p.slice(3,6)} ${p.slice(6,9)} ${p.slice(9)}` : p;
const ago = iso => {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 60) return `${m} хв тому`; if (m < 1440) return `${Math.round(m / 60)} год тому`;
  return new Date(iso).toLocaleDateString("uk-UA", { day: "numeric", month: "short" });
};

function renderTabs() {
  document.getElementById("tabs").innerHTML = TABS.map(t =>
    `<button class="tab ${t === tab ? "on" : ""}" data-id="${t.id}">${t.label}</button>`).join("");
}

async function load() {
  const p = new URLSearchParams({ category: tab.cat, status: tab.status || "",
    deal: document.getElementById("deal").value, q: document.getElementById("q").value });
  rows = await (await fetch("/api/leads?" + p)).json();
  if (tab.statuses) rows = rows.filter(r => tab.statuses.includes(r.status));
  render();
}

function render() {
  const el = document.getElementById("list");
  if (!rows.length) { el.innerHTML = `<div class="empty">Порожньо. Нові ліди з'являться тут і в Telegram.</div>`; return; }
  el.innerHTML = rows.map(r => `
    <article class="card ${r.category} ${["rejected","not_interesting","agent"].includes(r.status) ? "done" : ""}" id="lead-${r.id}">
      <div class="top"><span class="dot"></span>${CAT[r.category]} · ${r.deal === "predaj" ? "продаж" : "оренда"} · ${SRC[r.source] || r.source} · ${ago(r.first_seen)}</div>
      <a class="title" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title || "без назви")}</a>
      <div class="meta">
        ${r.price_text ? `<span class="chip price">${esc(r.price_text)}</span>` : ""}
        ${r.location ? `<span class="chip">${esc(r.location)}</span>` : ""}
        ${r.seller_name ? `<span class="chip">👤 ${esc(r.seller_name)}</span>` : ""}
        ${r.wants_no_rk ? `<span class="chip warn">🤫 просить без RK</span>` : ""}
        ${(r.phones || "").split(",").filter(Boolean).map(p => `<a class="tel chip" href="tel:+${p}">${phone(p)}</a>`).join("")}
      </div>
      <div class="desc" onclick="this.classList.toggle('open')">${esc(r.description)}</div>
      <details><summary>чому score ${r.score}</summary>${r.reasons.map(esc).join("<br>") || "—"}</details>
      <div class="actions">
        <select data-id="${r.id}" class="st">${Object.entries(STATUSES).map(([k, v]) =>
          `<option value="${k}" ${k === r.status ? "selected" : ""}>${v}</option>`).join("")}</select>
        <textarea data-id="${r.id}" class="note" placeholder="Нотатка: ім'я, коли передзвонити…">${esc(r.note)}</textarea>
      </div>
    </article>`).join("");
}

async function patch(id, body) {
  await fetch(`/api/leads/${id}`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
}

async function stats() {
  const s = await (await fetch("/api/stats")).json();
  const c = s.by_category || {};
  document.getElementById("stats").textContent =
    `сьогодні ${s.leads_today} · 🟢${c.private || 0} 🟡${c.suspicious || 0} 🔴${c.agency || 0}` +
    (s.running ? " · перевіряю…" : s.last_run ? ` · ${ago(s.last_run)}` : "");
}

document.getElementById("tabs").onclick = e => {
  const t = TABS.find(x => x.id === e.target.dataset.id); if (!t) return;
  tab = t; renderTabs(); load();
};
document.getElementById("list").addEventListener("change", async e => {
  if (e.target.classList.contains("st")) { await patch(e.target.dataset.id, { status: e.target.value }); load(); stats(); }
});
document.getElementById("list").addEventListener("focusout", e => {
  if (e.target.classList.contains("note")) patch(e.target.dataset.id, { note: e.target.value });
});
let t; document.getElementById("q").oninput = () => { clearTimeout(t); t = setTimeout(load, 250); };
document.getElementById("deal").onchange = load;
document.getElementById("run").onclick = async () => { await fetch("/api/run", { method: "POST" }); stats(); };

renderTabs(); load(); stats();
setInterval(() => { stats(); if (!document.activeElement.matches("textarea,input")) load(); }, 60000);
</script>
</body>
</html>
